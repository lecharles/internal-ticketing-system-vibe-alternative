{% extends "base.html" %}

{% block title %}Internal Server Error{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 text-center">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                500 - Internal Server Error
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Something went wrong on our end. Our team has been notified and is working on it.
            </p>
        </div>
        <div class="mt-5">
            <a href="{{ url_for('main.index') }}"
               class="inline-flex items-center px-4 py-2 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-primary hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                Return to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
